<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reta Product Flashcard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #e8317a;
    --pink-light: #fde8f2;
    --pink-mid: #f7b8d8;
    --dark: #1a1020;
    --gray: #6b5f72;
    --bg: #fdf5f9;
    --white: #ffffff;
    --green: #2ecc8a;
    --yellow: #f5c842;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--dark);
  }

  header {
    background: var(--dark);
    color: white;
    padding: 18px 20px 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
  }

  header h1 span { color: var(--pink); }

  .subtitle {
    font-size: 0.75rem;
    color: var(--pink-mid);
    margin-top: 2px;
    font-weight: 300;
  }

  /* TABS */
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 0;
    background: var(--dark);
    padding: 0 16px 12px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6);
    background: transparent;
    transition: all 0.2s;
    margin-right: 6px;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--pink);
    border-color: var(--pink);
    color: white;
  }

  /* STATS BAR */
  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px 20px;
    background: white;
    border-bottom: 1px solid var(--pink-light);
    font-size: 0.75rem;
    color: var(--gray);
  }
  .stats span strong { color: var(--dark); }

  /* MODE TOGGLE */
  .mode-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .mode-btn {
    flex: 1;
    min-width: 120px;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid var(--pink-light);
    background: white;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--gray);
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--pink);
    border-color: var(--pink);
    color: white;
  }

  /* SEARCH */
  .search-wrap {
    padding: 0 16px 10px;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 12px;
    border: 2px solid var(--pink-light);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    outline: none;
    background: white;
    color: var(--dark);
  }
  .search-wrap input:focus { border-color: var(--pink); }

  /* CARD LIST MODE */
  .card-list {
    padding: 0 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1.5px solid var(--pink-light);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(232,49,122,0.06);
  }
  .card:hover { box-shadow: 0 4px 16px rgba(232,49,122,0.15); transform: translateY(-1px); }

  .card-front {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .card-nota {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: var(--pink);
    font-weight: 400;
    margin-bottom: 4px;
  }

  .badge-container {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .card-category-badge {
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--pink-light);
    color: var(--pink);
    font-weight: 600;
    white-space: nowrap;
  }

  .bpom-badge {
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 600;
    white-space: nowrap;
  }
  .bpom-true {
    background: #e8faf3;
    color: #1a7a52;
  }
  .bpom-false {
    background: #fff0f5;
    color: #c0205a;
  }

  .card-back {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px dashed var(--pink-light);
    padding-top: 12px;
    animation: slideDown 0.2s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card.open .card-back { display: block; }
  .card.open { border-color: var(--pink); }

  .card-resmi {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--dark);
    margin-bottom: 4px;
  }

  .card-fungsi {
    font-size: 0.8rem;
    color: var(--gray);
    line-height: 1.5;
  }

  .card-chevron {
    font-size: 0.8rem;
    color: var(--pink-mid);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .card.open .card-chevron { transform: rotate(180deg); }

  /* FLASHCARD QUIZ MODE */
  .quiz-wrap {
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-bottom: 80px;
  }

  .quiz-progress {
    width: 100%;
    font-size: 0.75rem;
    color: var(--gray);
    text-align: center;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--pink-light);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--pink);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .flashcard {
    width: 100%;
    min-height: 220px;
    perspective: 1000px;
    cursor: pointer;
  }

  .flashcard-inner {
    width: 100%;
    min-height: 220px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

  .fc-front, .fc-back {
    position: absolute;
    width: 100%;
    min-height: 220px;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }

  .fc-front {
    background: linear-gradient(135deg, var(--dark) 0%, #2d1a3a 100%);
    color: white;
    box-shadow: 0 8px 32px rgba(26,16,32,0.25);
  }

  .fc-back {
    background: linear-gradient(135deg, var(--pink) 0%, #c0205a 100%);
    color: white;
    transform: rotateY(180deg);
    box-shadow: 0 8px 32px rgba(232,49,122,0.3);
  }

  .fc-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .fc-main {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .fc-sub {
    font-size: 0.8rem;
    opacity: 0.9;
    line-height: 1.5;
  }

  .fc-hint {
    font-size: 0.7rem;
    opacity: 0.5;
    margin-top: 16px;
  }

  .quiz-actions {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .btn-wrong {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: #fff0f5;
    color: #c0205a;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid #fcc;
  }
  .btn-correct {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: #e8faf3;
    color: #1a7a52;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid #a8e6cc;
  }
  .btn-wrong:hover { background: #ffd0e0; }
  .btn-correct:hover { background: #c2f0dd; }

  .btn-next {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--dark);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-next:hover { background: var(--pink); }

  .score-card {
    width: 100%;
    background: white;
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    border: 2px solid var(--pink-light);
    box-shadow: 0 8px 32px rgba(232,49,122,0.1);
  }
  .score-big {
    font-family: 'DM Serif Display', serif;
    font-size: 4rem;
    color: var(--pink);
    line-height: 1;
  }
  .score-label { font-size: 0.85rem; color: var(--gray); margin: 8px 0 20px; }

  .btn-restart {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--pink);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .empty { text-align: center; padding: 40px 20px; color: var(--gray); font-size: 0.9rem; }

  /* SOUND BUTTON */
  .sound-btn {
    background: var(--pink-light);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    color: var(--pink);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .sound-btn:hover {
    background: var(--pink);
    color: white;
    transform: scale(1.08);
  }
  .sound-btn.speaking {
    background: var(--pink);
    color: white;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,49,122,0.4); }
    50% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(232,49,122,0); }
  }

  .sound-btn-quiz {
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-top: 14px;
    transition: all 0.2s;
  }
  .sound-btn-quiz:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.08);
  }
  .sound-btn-quiz.speaking {
    background: white;
    color: var(--pink);
    animation: pulse 0.8s ease-in-out infinite;
  }

  .card-resmi-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card-resmi-row .card-resmi { margin-bottom: 0; flex: 1; }

  .sound-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--pink-light);
    background: white;
    color: var(--gray);
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
  }
  .sound-toggle.on {
    background: var(--pink);
    border-color: var(--pink);
    color: white;
  }

  .voice-select {
    width: 100%;
    margin: 0 16px 10px;
    width: calc(100% - 32px);
    padding: 8px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--pink-light);
    background: white;
    color: var(--dark);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    outline: none;
  }
  .voice-select:focus { border-color: var(--pink); }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Reta <span>Product</span> Flashcard</h1>
  <div class="subtitle">Hafal nama produk dengan mudah ✨</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="stats">
  <span>Total: <strong id="stat-total">0</strong></span>
  <span>Kategori: <strong id="stat-cat">0</strong></span>
  <span id="stat-score-wrap">Skor: <strong id="stat-score">—</strong></span>
</div>

<div class="mode-bar">
  <button class="mode-btn active" id="btn-list" onclick="setMode('list')">📋 Daftar</button>
  <button class="mode-btn" id="btn-quiz" onclick="setMode('quiz')">🎯 Kuis Flashcard</button>
  <button class="sound-toggle on" id="btn-sound-toggle" onclick="toggleAutoSpeak()" title="Aktifkan/matikan suara otomatis di kuis">
    <span id="sound-toggle-icon">🔊</span><span id="sound-toggle-label">Auto</span>
  </button>
</div>

<div class="search-wrap" id="search-wrap">
  <input type="text" id="search" placeholder="🔍 Cari nama produk..." oninput="renderList()">
</div>

<select class="voice-select" id="voice-select" onchange="onVoiceChange()" title="Pilih suara">
  <option value="">🎤 Pilih suara (auto)</option>
</select>

<div class="card-list" id="card-list"></div>

<div class="quiz-wrap hidden" id="quiz-wrap">
  <div class="quiz-progress">
    <span id="quiz-prog-text">Kartu 1 dari 10</span>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>
  <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="flashcard-inner" id="flashcard-inner">
      <div class="fc-front">
        <div class="fc-label">Nama di Nota</div>
        <div class="fc-main" id="fc-nota">—</div>
        <div class="fc-sub" id="fc-cat">—</div>
        <button class="sound-btn-quiz" id="snd-quiz-front" onclick="event.stopPropagation();speakCurrent('front')" title="Dengar pengucapan">🔊</button>
        <div class="fc-hint">Ketuk untuk lihat jawaban</div>
      </div>
      <div class="fc-back">
        <div class="fc-label">Nama Resmi & Fungsi</div>
        <div class="fc-main" id="fc-resmi" style="font-size:1.3rem">—</div>
        <div class="fc-sub" id="fc-fungsi">—</div>
        <button class="sound-btn-quiz" id="snd-quiz-back" onclick="event.stopPropagation();speakCurrent('back')" title="Dengar pengucapan">🔊</button>
      </div>
    </div>
  </div>
  <div class="quiz-actions" id="quiz-actions" style="display:none">
    <button class="btn-wrong" onclick="answer(false)">✗ Belum hafal</button>
    <button class="btn-correct" onclick="answer(true)">✓ Hafal!</button>
  </div>
  <button class="btn-next hidden" id="btn-next" onclick="nextCard()">Kartu Berikutnya →</button>
  <div class="score-card hidden" id="score-card">
    <div class="score-big" id="score-num">0</div>
    <div class="score-label">dari <span id="score-total">0</span> kartu yang benar</div>
    <button class="btn-restart" onclick="startQuiz()">🔄 Ulangi Kuis</button>
  </div>
</div>

// --- SOUND / TEXT-TO-SPEECH ---
// Detect female-sounding voices by their well-known names across platforms
function isFemaleVoice(v) {
  const name = (v.name || '').toLowerCase();
  // Common female voice names: Apple, Microsoft, Google, Android, Indonesian
  const femaleKeywords = [
    'female', 'wanita', 'perempuan', 'woman',
    // Apple
    'samantha', 'victoria', 'karen', 'allison', 'ava', 'susan', 'kate',
    'serena', 'tessa', 'fiona', 'moira', 'veena', 'kathy', 'princess',
    // Microsoft
    'aria', 'jenny', 'zira', 'eva', 'hazel', 'heera', 'catherine',
    'linda', 'helena', 'sabina', 'michelle', 'clara', 'libby', 'sonia',
    'natasha', 'emma', 'amber', 'ashley', 'cora', 'elizabeth', 'monica',
    // Google
    'google us english', 'google uk english female',
    // Indonesian female
    'damayanti', 'gadis'
  ];
  return femaleKeywords.some(kw => name.includes(kw));
}

// Detect high-quality "natural" voices (much more human-like)
function isNaturalVoice(v) {
  const name = (v.name || '').toLowerCase();
  return /natural|neural|premium|enhanced|online|wavenet/i.test(name);
}

function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  const enVoices = voices.filter(v => /^en/i.test(v.lang));
  const idVoices = voices.filter(v => /^id/i.test(v.lang));

  // Priority 1: Natural/Neural female English voice (most human-like)
  let pick = enVoices.find(v => isFemaleVoice(v) && isNaturalVoice(v));
  if (pick) return pick;

  // Priority 2: Any female English voice
  pick = enVoices.find(v => isFemaleVoice(v));
  if (pick) return pick;

  // Priority 3: Natural English voice (often female by default on macOS/Chrome)
  pick = enVoices.find(v => isNaturalVoice(v));
  if (pick) return pick;

  // Priority 4: Default English voice
  pick = enVoices.find(v => v.default) || enVoices[0];
  if (pick) return pick;

  // Priority 5: Female Indonesian voice
  pick = idVoices.find(v => isFemaleVoice(v)) || idVoices[0];
  if (pick) return pick;

  return voices[0];
}

// Cache the best voice once voices are available
function refreshBestVoice() {
  bestVoice = pickVoice();
  populateVoiceSelect();
}

function populateVoiceSelect() {
  const select = document.getElementById('voice-select');
  if (!select || !('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return;

  // Only repopulate if we haven't yet (or count changed)
  if (select.dataset.populated === String(voices.length)) return;
  select.dataset.populated = String(voices.length);

  // Sort: female natural first, then female, then natural, then rest
  const score = (v) => {
    let s = 0;
    if (isFemaleVoice(v)) s += 100;
    if (isNaturalVoice(v)) s += 50;
    if (/^en/i.test(v.lang)) s += 10;
    if (/^id/i.test(v.lang)) s += 5;
    return s;
  };
  const sorted = [...voices].sort((a, b) => score(b) - score(a));

  const currentValue = select.value;
  select.innerHTML = '<option value="">🎤 Auto (rekomendasi: cewek + natural)</option>';
  sorted.forEach((v, i) => {
    const flag = isFemaleVoice(v) ? '👩 ' : '';
    const star = isNaturalVoice(v) ? '✨ ' : '';
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${flag}${star}${v.name} (${v.lang})`;
    select.appendChild(opt);
  });

  // Restore selection if it still exists
  if (currentValue) select.value = currentValue;
}

function onVoiceChange() {
  const select = document.getElementById('voice-select');
  const name = select.value;
  if (!name) {
    bestVoice = pickVoice();
    return;
  }
  const voices = window.speechSynthesis.getVoices();
  const found = voices.find(v => v.name === name);
  if (found) {
    bestVoice = found;
    // Preview the selected voice
    speak('Halo, ini suara saya', null);
  }
}

function speak(text, btnId) {
  if (!('speechSynthesis' in window)) {
    alert('Browser Anda tidak mendukung Text-to-Speech. Coba pakai Chrome/Edge/Safari terbaru.');
    return;
  }
  // Stop any ongoing speech
  window.speechSynthesis.cancel();
  if (currentSpeakingBtn) {
    const prev = document.getElementById(currentSpeakingBtn);
    if (prev) prev.classList.remove('speaking');
    currentSpeakingBtn = null;
  }

  // Clean up text: remove parentheses content & symbols for cleaner pronunciation
  const cleaned = text
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[\/\-—–]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const utter = new SpeechSynthesisUtterance(cleaned);
  const voice = bestVoice || pickVoice();
  if (voice) {
    utter.voice = voice;
    utter.lang = voice.lang;
  } else {
    utter.lang = 'en-US';
  }
  // Slightly slower & natural pitch for human-like delivery
  utter.rate = 0.95;
  utter.pitch = 1.0;
  utter.volume = 1.0;

  if (btnId) {
    const btn = document.getElementById(btnId);
    if (btn) {
      btn.classList.add('speaking');
      currentSpeakingBtn = btnId;
      utter.onend = utter.onerror = () => {
        btn.classList.remove('speaking');
        if (currentSpeakingBtn === btnId) currentSpeakingBtn = null;
      };
    }
  }
  window.speechSynthesis.speak(utter);
}

function speakCurrent(side) {
  if (!quizDeck[quizIdx]) return;
  const p = quizDeck[quizIdx];
  if (side === 'front') speak(p.nota, 'snd-quiz-front');
  else speak(p.resmi, 'snd-quiz-back');
}

function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  const btn = document.getElementById('btn-sound-toggle');
  const icon = document.getElementById('sound-toggle-icon');
  const label = document.getElementById('sound-toggle-label');
  btn.classList.toggle('on', autoSpeak);
  icon.textContent = autoSpeak ? '🔊' : '🔇';
  label.textContent = autoSpeak ? 'Auto' : 'Mute';
  if (!autoSpeak && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

// Pre-load voices (some browsers load asynchronously)
if ('speechSynthesis' in window) {
  refreshBestVoice();
  window.speechSynthesis.onvoiceschanged = refreshBestVoice;
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return products.filter(p =>
    (activeTab === "Semua" || p.cat === activeTab) &&
    (p.nota.toLowerCase().includes(q) || p.resmi.toLowerCase().includes(q) || p.fungsi.toLowerCase().includes(q))
  );
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map(c =>
    `<button class="tab ${c === activeTab ? 'active' : ''}" onclick="setTab('${c}')">${c}</button>`
  ).join('');
}

function setTab(cat) {
  activeTab = cat;
  renderTabs();
  renderList();
  document.getElementById('search').value = '';
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-list').classList.toggle('active', mode === 'list');
  document.getElementById('btn-quiz').classList.toggle('active', mode === 'quiz');
  document.getElementById('card-list').classList.toggle('hidden', mode !== 'list');
  document.getElementById('quiz-wrap').classList.toggle('hidden', mode !== 'quiz');
  document.getElementById('search-wrap').classList.toggle('hidden', mode !== 'list');
  // Update URL hash so the link can remember the mode
  if (mode === 'quiz') {
    if (window.location.hash !== '#quiz') history.replaceState(null, '', '#quiz');
  } else {
    if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  if (mode === 'quiz') startQuiz();
}

function renderList() {
  const filtered = getFiltered();
  const el = document.getElementById('card-list');
  document.getElementById('stat-total').textContent = products.length;
  document.getElementById('stat-cat').textContent = categories.length - 1;

  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty">Produk tidak ditemukan 🔍</div>';
    return;
  }

  el.innerHTML = filtered.map((p, i) => `
    <div class="card" id="card-${i}" onclick="toggleCard(${i})">
      <div class="card-front">
        <div style="flex:1;min-width:0">
          <div class="card-nota">${p.nota}</div>
          <div class="badge-container">
            <span class="card-category-badge">${p.cat}</span>
            ${p.bpom ? '<span class="bpom-badge bpom-true">✓ BPOM</span>' : '<span class="bpom-badge bpom-false">Non-BPOM</span>'}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="sound-btn" id="snd-front-${i}" onclick="event.stopPropagation();speak(${JSON.stringify(p.nota).replace(/"/g, '&quot;')}, 'snd-front-${i}')" title="Dengar pengucapan">🔊</button>
          <span class="card-chevron">▼</span>
        </div>
      </div>
      <div class="card-back">
        <div class="card-resmi-row">
          <div class="card-resmi">📋 ${p.resmi}</div>
          <button class="sound-btn" id="snd-back-${i}" onclick="event.stopPropagation();speak(${JSON.stringify(p.resmi).replace(/"/g, '&quot;')}, 'snd-back-${i}')" title="Dengar pengucapan">🔊</button>
        </div>
        <div class="card-fungsi">✨ ${p.fungsi}</div>
      </div>
    </div>
  `).join('');
}

function toggleCard(i) {
  const card = document.getElementById('card-' + i);
  card.classList.toggle('open');
}

function startQuiz() {
  const filtered = getFiltered();
  quizDeck = [...filtered].sort(() => Math.random() - 0.5);
  quizIdx = 0;
  quizScore = 0;
  flipped = false;
  answered = false;
  document.getElementById('score-card').classList.add('hidden');
  document.getElementById('flashcard').classList.remove('hidden');
  document.getElementById('quiz-actions').style.display = 'none';
  document.getElementById('btn-next').classList.add('hidden');
  showCard();
}

function showCard() {
  if (quizIdx >= quizDeck.length) {
    endQuiz();
    return;
  }
  const p = quizDeck[quizIdx];
  document.getElementById('fc-nota').textContent = p.nota;
  document.getElementById('fc-cat').innerHTML = `${p.cat} &bull; ${p.bpom ? '✓ BPOM' : 'Non-BPOM'}`;
  document.getElementById('fc-resmi').textContent = p.resmi;
  document.getElementById('fc-fungsi').textContent = p.fungsi;

  const fill = ((quizIdx) / quizDeck.length * 100).toFixed(0);
  document.getElementById('prog-fill').style.width = fill + '%';
  document.getElementById('quiz-prog-text').textContent = `Kartu ${quizIdx + 1} dari ${quizDeck.length}`;

  flipped = false;
  answered = false;
  document.getElementById('flashcard-inner').style.transform = '';
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('quiz-actions').style.display = 'none';
  document.getElementById('btn-next').classList.add('hidden');

  if (autoSpeak) {
    setTimeout(() => speak(p.nota, 'snd-quiz-front'), 250);
  }
}

function flipCard() {
  if (answered) return;
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
  if (flipped) {
    document.getElementById('quiz-actions').style.display = 'flex';
    if (autoSpeak && quizDeck[quizIdx]) {
      setTimeout(() => speak(quizDeck[quizIdx].resmi, 'snd-quiz-back'), 350);
    }
  }
}

function answer(correct) {
  if (correct) quizScore++;
  answered = true;
  document.getElementById('quiz-actions').style.display = 'none';
  document.getElementById('btn-next').classList.remove('hidden');
}

function nextCard() {
  quizIdx++;
  showCard();
}

function endQuiz() {
  document.getElementById('flashcard').classList.add('hidden');
  document.getElementById('quiz-actions').style.display = 'none';
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('score-card').classList.remove('hidden');
  document.getElementById('score-num').textContent = quizScore;
  document.getElementById('score-total').textContent = quizDeck.length;
  document.getElementById('stat-score').textContent = `${quizScore}/${quizDeck.length}`;
}

// Init
renderTabs();
renderList();

// Open directly in quiz mode if URL hash is #quiz
if (window.location.hash === '#quiz') {
  setMode('quiz');
}
</script>

</body>
</html>
